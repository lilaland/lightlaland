<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16171a">
<title>lightlaland</title>
<style>
/* An old lighting desk: charcoal panels with screws, rubber keys with LEDs, a teal VFD and
   a green phosphor radar for the magic sheet. System fonts only, so it works offline. */
:root {
  --desk: #121315;
  --panel: #26272b; --panel-2: #1f2023; --panel-hi: #3a3b41; --panel-lo: #0b0b0d;
  --key: #34353b; --key-2: #27282d; --key-hi: #4a4b52;
  --silk: #cfc8b4; --silk-dim: #8d887a; --amber: #ffb52e;
  --vfd: #6bfbe6; --vfd-mid: #2fbfae; --vfd-off: #0f2b28; --vfd-bg: #041311;
  --crt: #3dff86; --crt-dim: #1b8f4b; --crt-bg: #020a05;
  --red: #ff3b30; --green: #3dff86;
  --ui: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: Menlo, Monaco, "Lucida Console", "Courier New", monospace;
  --top: 52px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--desk); color: var(--silk); }
body {
  font: 13px/1.4 var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(ellipse at 50% -20%, #24252a, transparent 70%), repeating-linear-gradient(90deg, #131416 0 2px, #121315 2px 4px);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- panels: painted metal with a screw in each corner ---------- */
.panel {
  position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background:
    radial-gradient(circle at 9px 9px, #6d6e74 0 1.6px, #1a1a1d 2.2px, transparent 3.2px),
    radial-gradient(circle at calc(100% - 9px) 9px, #6d6e74 0 1.6px, #1a1a1d 2.2px, transparent 3.2px),
    radial-gradient(circle at 9px calc(100% - 9px), #6d6e74 0 1.6px, #1a1a1d 2.2px, transparent 3.2px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), #6d6e74 0 1.6px, #1a1a1d 2.2px, transparent 3.2px),
    linear-gradient(#2b2c31, #222327);
  border: 1px solid #08080a; border-radius: 6px;
  box-shadow: inset 0 1px 0 var(--panel-hi), inset 0 -1px 0 #000, 0 2px 6px rgba(0, 0, 0, .55);
  padding: 22px 12px 12px;
}
.panel > .label {
  position: absolute; top: 5px; left: 20px; right: 20px; display: flex; align-items: center; gap: 8px;
  font: 600 10px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--silk);
}
.panel > .label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #5a574e, transparent); }
.silk { font: 600 10px/1.2 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--silk-dim); }

/* ---------- rubber keys ---------- */
.key, .btn {
  position: relative; padding: 8px 12px; border: 1px solid #070708; border-radius: 6px;
  background: linear-gradient(#3d3e44, #2c2d32 60%, #26272b);
  box-shadow: inset 0 1px 0 #55565d, 0 3px 0 #0a0a0b, 0 4px 6px rgba(0, 0, 0, .45);
  font: 700 12px/1.1 var(--ui); letter-spacing: .06em; color: #e6e1d2; white-space: nowrap; text-transform: uppercase;
  transition: transform .04s, box-shadow .04s;
}
.key:active, .btn:active, .key.hit, .btn.hit { transform: translateY(3px); box-shadow: inset 0 1px 0 #4a4b52, 0 0 0 #0a0a0b, 0 1px 2px rgba(0, 0, 0, .5); }
.btn[aria-pressed="true"], .key[aria-pressed="true"] { color: var(--amber); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.small { padding: 6px 9px; font-size: 11px; }
.led {
  display: inline-block; width: 9px; height: 5px; border-radius: 2px; margin-right: 7px; vertical-align: 2px;
  background: #3a2a10; box-shadow: inset 0 0 0 1px #000;
}
.btn[aria-pressed="true"] .led, .key.on .led, .pad.on .led { background: var(--amber); box-shadow: 0 0 8px var(--amber), inset 0 0 0 1px #6b4a00; }
.led.green { background: #10301c; }
.pad.on .led.green, .btn[aria-pressed="true"] .led.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
.pad {
  position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
  border: 1px solid #070708; border-radius: 8px; padding: 8px;
  background: linear-gradient(#3d3e44, #2c2d32 60%, #26272b);
  box-shadow: inset 0 1px 0 #55565d, 0 4px 0 #0a0a0b, 0 5px 8px rgba(0, 0, 0, .5);
  color: #ece7d8; font: 800 18px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: transform .04s, box-shadow .04s;
}
.pad small { font: 600 10px/1.2 var(--ui); letter-spacing: .12em; color: #a9a392; text-align: center; }
.pad .led { position: absolute; top: 9px; right: 9px; margin: 0; }
.pad:active, .pad.hit { transform: translateY(4px); box-shadow: inset 0 1px 0 #4a4b52, 0 0 0 #0a0a0b, 0 1px 2px rgba(0, 0, 0, .5); }
.pad.cap-red { background: linear-gradient(#c0443d, #9a2e29 60%, #852723); box-shadow: inset 0 1px 0 #e0706a, 0 4px 0 #2a0b09, 0 5px 8px rgba(0,0,0,.5); }
.pad.cap-blue { background: linear-gradient(#3b63b4, #2a4c94 60%, #233f7d); box-shadow: inset 0 1px 0 #6f93d8, 0 4px 0 #0b1530, 0 5px 8px rgba(0,0,0,.5); }
.pad.cap-green { background: linear-gradient(#3b9658, #2c7744 60%, #24653a); box-shadow: inset 0 1px 0 #6cc488, 0 4px 0 #0b2414, 0 5px 8px rgba(0,0,0,.5); }
.pad.cap-purple { background: linear-gradient(#7d4cb3, #643a96 60%, #553182); box-shadow: inset 0 1px 0 #a780d6, 0 4px 0 #1f0f33, 0 5px 8px rgba(0,0,0,.5); }
.pad[class*="cap-"] small { color: #f0e6e6; opacity: .85; }
.pad[class*="cap-"]:active, .pad[class*="cap-"].hit { box-shadow: 0 0 0 #000, 0 1px 2px rgba(0,0,0,.5); }
.pad.flash { background: #fff8e6 !important; color: #000; }
.pad.flash small { color: #333; }
.pad.dark { background: #050506 !important; color: #444; }

/* ---------- top: brand plate, mode keys, status ---------- */
.top {
  height: var(--top); display: flex; align-items: center; gap: 14px;
  padding: 0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
  background: linear-gradient(#2a2b30, #1b1c1f); border-bottom: 1px solid #000; box-shadow: inset 0 1px 0 #44454b, 0 2px 8px rgba(0,0,0,.6);
}
.plate {
  display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 4px;
  background: linear-gradient(#bdb9ad, #8f8b80); box-shadow: inset 0 1px 0 #e8e4d8, inset 0 -1px 0 #5d5a52, 0 1px 3px #000;
  color: #1f1e1b; white-space: nowrap;
}
.plate b { font: 900 16px/1 var(--ui); letter-spacing: .04em; font-style: italic; }
.plate span { font: 700 9px/1 var(--ui); letter-spacing: .2em; }
.tabs { display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 8px; margin-top: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .key { padding: 8px 12px; }
.status { margin-left: auto; display: flex; align-items: center; gap: 10px; white-space: nowrap; min-width: 0; }
.vfd-mini { padding: 4px 8px; border-radius: 3px; font: 11px/1 var(--mono); }
.src { overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.meter { display: flex; gap: 2px; }
.meter i { width: 5px; height: 12px; border-radius: 1px; background: #102a10; }
.meter i.on { background: var(--green); box-shadow: 0 0 4px var(--green); }
.meter i.on.hot { background: var(--amber); box-shadow: 0 0 4px var(--amber); }
.meter i.on.clip { background: var(--red); box-shadow: 0 0 4px var(--red); }
.out { display: inline-flex; gap: 8px; font: 700 11px var(--ui); letter-spacing: .1em; }
.out span { display: inline-flex; align-items: center; gap: 4px; }
.out span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #333; box-shadow: inset 0 0 0 1px #000; }
.out span.ok::before { background: var(--green); box-shadow: 0 0 6px var(--green); }
.out span.bad::before { background: var(--red); box-shadow: 0 0 6px var(--red); }
#conn { color: var(--amber); font-size: 11px; }

/* ---------- VFD and CRT glass ---------- */
.vfd {
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .25) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 40%, #07211d, var(--vfd-bg) 75%);
  border: 1px solid #000; border-radius: 4px; box-shadow: inset 0 2px 8px #000, 0 1px 0 #3a3b41;
  color: var(--vfd); text-shadow: 0 0 6px rgba(107, 251, 230, .55); font-family: var(--mono);
}
.crt {
  position: relative; background: var(--crt-bg); border-radius: 14px; overflow: hidden;
  border: 3px solid #0b0b0c; box-shadow: inset 0 0 0 2px #2a2b30, 0 0 0 4px #1a1b1e, inset 0 0 40px rgba(0, 0, 0, .9);
}
.crt::after {   /* scanlines and a bit of curvature shading */
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 12px;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .28) 0 1px, transparent 1px 3px),
              radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .55) 100%);
}
.crt canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.seven svg { height: 100%; width: auto; display: block; }
.seven .on { fill: var(--vfd); filter: drop-shadow(0 0 3px rgba(107, 251, 230, .8)); }
.seven .off { fill: var(--vfd-off); }

/* ---------- main layout (Show, Mount, Make, Setup) ---------- */
.layout {
  height: calc(100dvh - var(--top)); display: grid; gap: 8px; padding: 8px;
  grid-template-columns: minmax(0, 1fr) 380px;
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "vis side" "pl side";
}
body:not(.tab-show) .layout { grid-template-rows: minmax(0, 1fr); grid-template-areas: "vis side"; }
body.tab-setup .layout, body.tab-make .layout, body.tab-mount .layout { grid-template-columns: minmax(0, 1fr) 480px; }
.vis { grid-area: vis; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.pl { grid-area: pl; }
body:not(.tab-show) .show-only { display: none !important; }
body:not(.tab-mount) .mount-only { display: none !important; }
body:not(.tab-make) .make-only { display: none !important; }
body:not(.tab-setup) .setup-only { display: none !important; }
body.tab-perform .layout { display: none; }

.vis-grid { flex: 1; min-height: 0; display: grid; gap: 10px; grid-template-rows: minmax(0, 1fr) auto; }
.sheet { min-height: 160px; }
.sheet canvas { touch-action: none; }
body.editing .sheet canvas { cursor: move; }
.viewkeys { position: absolute; right: 12px; bottom: 10px; z-index: 2; display: flex; gap: 4px; }
.viewkeys button { font: 700 10px var(--mono); letter-spacing: .1em; color: rgba(61, 255, 134, .5); background: rgba(2, 10, 5, .75);
  border: 1px solid rgba(61, 255, 134, .3); border-radius: 4px; padding: 5px 8px; cursor: pointer; }
.viewkeys button[aria-pressed="true"] { color: #3dff86; border-color: #3dff86; text-shadow: 0 0 6px rgba(61, 255, 134, .7); }
.preview-flag { position: absolute; top: 10px; right: 14px; z-index: 2; color: var(--amber); font: 700 11px var(--mono); letter-spacing: .1em; pointer-events: none; }
.rigs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rig { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 8px; align-items: stretch; }
.rig .bars { position: relative; min-height: 58px; }
.rig .bars canvas, .rig .tilt canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.rig .tilt { position: relative; min-height: 84px; border-radius: 10px; }

/* VFD (Show) */
.disp { padding: 10px 12px 8px; }
.disp-top { display: flex; align-items: flex-end; gap: 12px; }
.bpm7 { height: 52px; }
.bpm-unit { font-size: 11px; color: var(--vfd-mid); margin-bottom: 4px; letter-spacing: .15em; }
.beats { display: flex; gap: 5px; margin-bottom: 8px; }
.beats i { width: 15px; height: 8px; border-radius: 1px; background: var(--vfd-off); }
.beats i.on { background: var(--vfd); box-shadow: 0 0 8px var(--vfd); }
.spec { margin-left: auto; width: 100px; height: 44px; }
.marquee { overflow: hidden; white-space: nowrap; margin-top: 8px; font-size: 13px; letter-spacing: .12em; }
.marquee span { display: inline-block; padding-left: 100%; animation: marquee 16s linear infinite; }
@keyframes marquee { to { transform: translateX(-100%); } }
.disp-bottom { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--vfd-mid); margin-top: 6px; letter-spacing: .12em; }
.phrase { display: flex; gap: 2px; margin-top: 8px; height: 9px; }
.phrase i { flex: 1; background: var(--vfd-off); border-radius: 1px; }
.phrase i.on { background: var(--vfd-mid); }
.phrase i.now { background: var(--vfd); box-shadow: 0 0 6px var(--vfd); }

/* pads (Show) */
.pads { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(54px, 1fr); gap: 10px; padding: 4px 2px 6px; }
.pads .pad.wide { grid-column: span 2; font-size: 24px; }

/* scene list (Show) */
.pl-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 6px; padding: 6px; max-height: 30vh; overflow-y: auto; }
.pl-list .track { padding: 4px 6px; }
.pl-col { display: flex; flex-direction: column; min-width: 0; }
.pl-col .silk { color: var(--vfd-mid); padding: 2px 6px 4px; }
.track {
  display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 6px; min-width: 0;
  border: 0; border-radius: 2px; background: none; color: var(--vfd); font: 12px/1.15 var(--mono); text-align: left;
  text-shadow: 0 0 5px rgba(107, 251, 230, .45);
}
.track span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track .sw { display: inline-flex; gap: 1px; flex: 0 0 auto; }
.track .sw i { width: 5px; height: 9px; }
.track[aria-pressed="true"] { background: var(--vfd); color: #031512; text-shadow: none; }
.track.off { opacity: .45; }
.pl-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 10px; }
.swatches { display: inline-flex; align-items: center; gap: 5px; }
.swatch {
  position: relative; display: block; width: 28px; height: 28px; border-radius: 4px; flex: 0 0 auto; padding: 0;
  border: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.35), 0 1px 2px #000;
}
.swatch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; padding: 0; cursor: pointer; }
.swatch.sel { outline: 2px solid var(--amber); outline-offset: 2px; }
.seg { display: inline-flex; gap: 4px; }
.fader { display: inline-flex; align-items: center; gap: 8px; }
input[type=range] { accent-color: var(--amber); width: 150px; }

/* dialogs (mount, make, setup) */
.dlg { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 4px 14px; -webkit-overflow-scrolling: touch; }
.dlg p { margin: 6px 0 10px; color: var(--silk-dim); max-width: 64ch; }
fieldset {
  margin: 12px 0 0; padding: 10px 12px 12px; border: 1px solid #0a0a0c; border-radius: 6px;
  background: rgba(0, 0, 0, .14); box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 1px 0 #3a3b41;
}
legend { padding: 0 6px; font: 700 10px var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.form label { display: flex; flex-direction: column; gap: 5px; font: 600 10px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--silk-dim); min-width: 0; }
.form .full { grid-column: span 2; }
.form .check { flex-direction: row; align-items: center; gap: 8px; color: var(--silk); letter-spacing: .06em; }
.form input:not([type=checkbox]):not([type=range]), .form select, .dlg select {
  width: 100%; padding: 7px 8px; border-radius: 3px; border: 1px solid #000;
  background: var(--vfd-bg); color: var(--vfd); font: 13px var(--mono); box-shadow: inset 0 2px 5px #000;
}
.form input[type=range] { width: 100%; }
.form .val { color: var(--vfd); font-family: var(--mono); letter-spacing: 0; text-transform: none; }
.form .fhint { font: 11px/1.3 var(--ui); letter-spacing: 0; text-transform: none; color: #77736a; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { font-size: 12px; color: var(--silk-dim); }
.warn { color: var(--amber); }
.danger { color: #ff6b62; }
.readout { padding: 10px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.big-value { font: 40px/1 var(--mono); }
.nudge { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
.nudge .btn { padding: 12px 0; font-size: 14px; }
.list { margin: 6px 0 0; padding: 4px; list-style: none; }
.list li { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto auto; gap: 6px 10px; align-items: center; padding: 6px 6px; }
.list li + li { border-top: 1px solid #0d2b27; }
.list .sub { color: var(--vfd-mid); font-size: 12px; }
.node { padding: 8px 10px; }
.node + .node { border-top: 1px solid #0d2b27; }
.node b { color: #e7fffb; }
.node .sub { color: var(--vfd-mid); font-size: 12px; margin: 3px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .btn { min-width: 38px; }
.mk-bar { position: sticky; top: 0; z-index: 2; padding: 6px 0 10px; background: linear-gradient(#26272b 85%, transparent); }
.mk-pal { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status-vfd { padding: 8px 10px; font-size: 13px; letter-spacing: .06em; line-height: 1.45; }
.status-vfd .bad { color: #ff8a80; text-shadow: 0 0 6px rgba(255, 90, 80, .6); }

/* ---------- perform (iPad / phone) ---------- */
.perform {
  display: none; height: calc(100dvh - var(--top)); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 8px max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
  grid-template-columns: minmax(0, 1fr); align-content: start; gap: 8px;
}
body.tab-perform .perform { display: grid; }
.pf-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pf-rigs { display: grid; gap: 8px; }
.pf-rig { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 8px; }
.pf-rig .bars { position: relative; height: clamp(58px, 11vw, 74px); }
.pf-rig .tilt { position: relative; height: clamp(58px, 11vw, 74px); border-radius: 8px; }
.pf-rig canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pf-group { padding: 6px 10px 10px; }
.pf-head {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 4px; min-height: 52px;
  background: none; border: 0; color: var(--silk); text-align: left; font: 700 12px/1.2 var(--ui); letter-spacing: .16em; text-transform: uppercase;
}
.pf-head .chev { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
  background: linear-gradient(#3d3e44, #26272b); box-shadow: inset 0 1px 0 #55565d, 0 2px 0 #0a0a0b; color: var(--amber); transition: transform .15s; }
.pf-head .chev::before { content: "\25BE"; font-size: 14px; }
.pf-group.open > .pf-head .chev { transform: rotate(180deg); }
.pf-body { display: none; padding: 2px 0 6px; }
.pf-group.open > .pf-body { display: block; }
.pf-room { height: min(60vh, 560px); }
.pf-lcd { display: flex; align-items: center; gap: 12px; padding: 6px 10px; text-transform: none; letter-spacing: .08em; }
.pf-lcd .seven { height: 34px; }
.pf-lcd .sub { font-size: 11px; color: var(--vfd-mid); }
.pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pf-grid .pad { min-height: 66px; }
.pf-grid .wide { grid-column: span 2; }
.pf-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.pf-row .btn { min-height: 44px; padding: 8px 14px; }
.pal-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pal-strip .swatch { width: 100%; height: 48px; }
.wheel-wrap { position: relative; width: min(100%, 300px); aspect-ratio: 1; margin: 6px auto; }
#wheel { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.preset { border: 1px solid #000; border-radius: 4px; padding: 0; overflow: hidden; background: #0c0c0e; text-align: left; box-shadow: 0 2px 0 #050506; }
.preset .bar { display: flex; height: 26px; }
.preset .bar i { flex: 1; }

// ---------- server ----------
async function api(cmd, body = {}) {
  try {
    const r = await fetch("/api/cmd", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cmd, ct: performance.now(), ...body }) });
    const j = await r.json();
    if (j.scenes) { S.meta.scenes = j.scenes; onScenes(); }
    if (j.config) { S.cfg = j.config; onConfig(); }
    if (!j.ok) toast(j.error || "The Mac didn't accept that.");
    return j;
  } catch (e) {
    toast("Can't reach the Mac. Is lightlaland still running?");
    return { ok: false };
  }
}
async function loadMeta() {
  const r = await fetch("/api/meta");

  ({ deg_per_step: DEG_PER_STEP, steps_per_turn: STEPS_PER_TURN } = S.meta.geometry);
  S.cfg = S.meta.config;

}

let wheelImg = null;
function drawWheel() {
  const cv = $("#wheel"); if (!visible(cv)) return;
  const p = shownPalette();

  const key = `${cv.clientWidth}:${hex}:${p.colors.join()}:${S.gen}`;
  if (S.wheelKey === key) return;
  S.wheelKey = key;
  const ctx = cv.getContext("2d"), dpr = fit(cv), W = cv.width, H = cv.height, R = Math.min(W, H) / 2 - 2 * dpr;
  if (!wheelImg || wheelImg.w !== W) {
    const img = ctx.createImageData(W, H), d = img.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = x - W / 2, dy = y - H / 2, dist = Math.hypot(dx, dy), o = (y * W + x) * 4;
      if (dist > R + dpr) continue;
      const [r, g, b] = hsvToRgb((Math.atan2(dy, dx) / (2 * Math.PI) + 1) % 1, Math.min(1, dist / R), 1);
      d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = dist > R ? 255 * (R + dpr - dist) / dpr : 255;
    }
    wheelImg = { w: W, img };
  }
  ctx.clearRect(0, 0, W, H);
  ctx.putImageData(wheelImg.img, 0, 0);
  const marks = S.gen === "edit" ? p.colors.map((c, i) => [c, i === S.palSel]) : [[hex, true]];
  for (const [c, sel] of marks) {
    const [h, s] = rgbToHsv(rgb(c)), a = h * 2 * Math.PI, mx = W / 2 + Math.cos(a) * s * R, my = H / 2 + Math.sin(a) * s * R;

    ctx.lineWidth = 1.5 * dpr; ctx.strokeStyle = sel ? "#fff" : "rgba(255,255,255,.6)"; ctx.stroke();

}

const SECTIONS = [["general", "Scene"], ["move", "Movement"], ["beams", "Beams"], ["strip", "LED strip"], ["white", "White strobes"], ["fx", "Effects"]];
const has = (list, v) => list.includes(v);
const SHOW_IF = {   // hide fields that don't apply to the current choices
  move: {
    target: m => has(["aim", "sweep"], m.mode), face: m => m.mode !== "spin", lift: m => m.mode !== "spin",
    sweep: m => m.mode === "sweep", period: m => m.mode === "sweep",
    spin: m => m.mode === "spin", hops: m => m.mode === "hop", hop_every: m => m.mode === "hop",
    converge: m => m.mode === "aim", jitter_rate: m => m.jitter > 0,
    trade_bars: m => m.pair === "trade", rest: m => m.pair === "trade",
  },
  layer: {
    _on: l => l.pattern !== "off",
    floor: l => !has(["off", "solid"], l.pattern),
    depth: l => l.pulse !== "none", decay: l => !has(["none", "breathe"], l.pulse) || l.pattern === "rain",
    rate: l => !has(["off", "solid"], l.pattern) || has(["scroll", "random", "rainbow"], l.color),
    width: l => has(["chase", "bounce", "midout", "wave"], l.pattern), count: l => l.pattern === "sparkle",
    density: l => has(["rain", "twinkle"], l.pattern),
    reverse: l => has(["chase", "bounce", "fill", "wave"], l.pattern) || has(["ab", "spread", "scroll", "rainbow"], l.color),
    flip_bars: l => has(["chase", "bounce", "midout", "fill"], l.pattern),
  },
  fx: { lightning_level: f => f.lightning > 0, lightning_beams: f => f.lightning > 0 },
};
function blankSpec() {
  const sp = { palette: ["#ff1f5a", "#ff6a3d", "#ffb000", "#00e1ff", "#7b2cff"] };
  for (const [sec] of SECTIONS) {
    const vals = {};
    for (const f of S.meta.schema[sec]) vals[f.key] = f.default;
    if (sec === "general") Object.assign(sp, vals); else sp[sec] = vals;
  }
  return sp;
}
function fieldShown(sec, f, d) {
  const part = sec === "general" ? d : d[sec];
  if (sec === "move") return (SHOW_IF.move[f.key] || (() => true))(part);
  if (sec === "fx") return (SHOW_IF.fx[f.key] || (() => true))(part);
  if (sec === "general") return true;
  if (f.key !== "pattern" && !SHOW_IF.layer._on(part)) return false;
  return (SHOW_IF.layer[f.key] || (() => true))(part);
}
function fmtNum(f, v, d) {
  if (["level", "floor", "depth", "speed", "spin", "density", "lightning_level"].includes(f.key)) return `${Math.round(v * 100)}%`;
  if (f.key === "width") return `${Math.round(v * 100)}% of the bar`;
  if (f.key === "rate") return `${+(+v).toFixed(2)} ${d && d.clock === "seconds" ? "s" : "beats"}`;
  return String(+(+v).toFixed(2));
}
function fieldHtml(sec, f, v, d) {
  const id = `mk-${sec}-${f.key}`, hint = f.hint ? `<span class="fhint">${esc(f.hint)}</span>` : "";
  if (f.kind === "choice") return `<label>${esc(f.label)}<select id="${id}" data-sec="${sec}" data-key="${f.key}">${
    f.options.map(([o, l]) => `<option value="${o}" ${o === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>${hint}</label>`;
  if (f.kind === "num") return `<label>${esc(f.label)}: <span class="val" id="${id}-v">${fmtNum(f, v, d)}</span>
    <input type="range" id="${id}" data-sec="${sec}" data-key="${f.key}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}">${hint}</label>`;
  if (f.kind === "bool") return `<label class="check"><input type="checkbox" id="${id}" data-sec="${sec}" data-key="${f.key}" ${v ? "checked" : ""}>${esc(f.label)}</label>`;
  return `<label class="full">${esc(f.label)}<input id="${id}" data-sec="${sec}" data-key="${f.key}" value="${esc(v)}" maxlength="80">${hint}</label>`;
}
function selectMake(name) {
  const sc = sceneBy(name) || scenes()[0];

}
let previewTimer = null, previewKeepAlive = null;
function sendPreview() {

function searchHtml() {
  if (S.searching) return `<p class="hint">Asking every node on the network to answer…</p>`;

  const when = new Date(r.at * 1000).toLocaleTimeString();
  if (!r.nodes.length) {
    return `<div class="vfd node">No node answered (${when}).<div class="sub">A node on a different IP range,

      Sending by broadcast still reaches it.</div>
      <button class="btn small" data-use="broadcast">Send to both lights by broadcast</button></div>`;
  }
  return `<div class="vfd">${r.nodes.map((n, i) => `

async function useNode(how, idx) {
  const node = S.search && S.search.nodes[idx];
  const outs = node ? node.outputs : [];
  const ip = how === "ip" && node ? node.ip : "broadcast";
  for (let i = 0; i < S.cfg.fixtures.length; i++) {
    const fields = { ip };
    if (outs.length) fields.universe = outs[Math.min(i, outs.length - 1)];
    await api("fixture", { index: i, fields });
  }
  toast(node ? `Both lights now go to ${node.long || node.ip} ${how === "ip" ? "at " + node.ip : "by broadcast"}.` : "Both lights now send by broadcast.");
}

function snapToWall(f, facing) {   // choosing a wall in the form moves the bar onto it

  if (facing === 270) return { x: clamp(f.x, 0.5, room.w - 0.5), y: room.d };
  if (facing === 0) return { x: 0, y: clamp(f.y, 0.5, room.d - 0.5) };

  const dir = e => [Math.cos(e * D2R), -Math.sin(e * D2R)];
  ctx.fillStyle = "rgba(61,255,134,0.10)"; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, -sf.high * D2R, -sf.low * D2R); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,60,50,0.14)"; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, -sf.low * D2R, (360 - sf.high) * D2R); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = CRT_FAINT; ctx.lineWidth = dpr;
  ctx.beginPath(); ctx.moveTo(cx - r * 1.05, cy); ctx.lineTo(cx + r * 1.15, cy); ctx.stroke();       // level
  ctx.strokeStyle = CRT_DIM; ctx.beginPath(); ctx.moveTo(cx - r * 1.0, cy - r); ctx.lineTo(cx - r * 1.0, cy + r); ctx.stroke();   // wall
  const shown = v.shown, bi = avgColour(v.beams), lit = bi.level > 0.02;
  const [bx, by] = dir(shown);
  ctx.lineWidth = 2.5 * dpr; ctx.setLineDash(lit ? [] : [4 * dpr, 3 * dpr]);
  ctx.strokeStyle = lit ? rgba(bi.col.map(c => Math.max(c, 60)), 1) : "rgba(255,110,90,0.8)";
  ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = lit ? 8 * dpr : 0;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + bx * r, cy + by * r); ctx.stroke();
  ctx.setLineDash([]); ctx.shadowBlur = 0;
  const st = avgColour(v.strip);   // the LED side points the other way
  ctx.strokeStyle = st.level > 0.03 ? rgba(st.col, 0.9) : CRT_DIM; ctx.lineWidth = 4 * dpr;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - bx * r * 0.5, cy - by * r * 0.5); ctx.stroke();
  if (!v.spin && Math.abs(wrap180(v.elev - shown)) > 2) {   // where it's heading
    const [tx, ty] = dir(v.elev);
    ctx.fillStyle = CRT; ctx.beginPath(); ctx.arc(cx + tx * r, cy + ty * r, 2.5 * dpr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "#16171a"; ctx.strokeStyle = CRT; ctx.lineWidth = 1.2 * dpr;
  ctx.beginPath(); ctx.arc(cx, cy, 4.5 * dpr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.font = `bold ${11 * dpr}px ${MONO}`; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillStyle = CRT;
  ctx.fillText(fx.id, 6 * dpr, 5 * dpr);
  ctx.textAlign = "right"; ctx.font = `${10 * dpr}px ${MONO}`;
  ctx.fillText(v.spin ? "SPIN" : fx.calibrated ? `${Math.round(shown)}°` : "?°", W - 6 * dpr, 5 * dpr);
  ctx.textBaseline = "bottom"; ctx.fillStyle = v.safe ? CRT_DIM : "rgba(255,120,100,0.95)";
  ctx.fillText(v.safe ? (v.why === "safety off" ? "NO SAFETY" : "BEAMS OK") : (v.why || "").toUpperCase(), W - 6 * dpr, H - 4 * dpr);
}

// ---------- drawing: both faces of a bar ----------
// The beam side (12 lenses in 6 pairs) and the LED side (8 positions, each RGB / white / RGB).
// Index 0 is the bar's first end. The side facing the room is bright, the other dimmed.
function drawBar(cv, v, fx) {
  const ctx = cv.getContext("2d"), dpr = fit(cv), W = cv.width, H = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (!v || !fx || W < 60 * dpr || H < 20 * dpr) return;   // not laid out yet
  const lab = 18 * dpr, gap = 5 * dpr, rowH = (H - gap) / 2, L = W - lab;
  ctx.font = `bold ${12 * dpr}px ${MONO}`; ctx.fillStyle = "#cfc8b4"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(fx.id, lab / 2, H / 2);
  const beamsOut = !v.spin && Math.abs(wrap180(v.shown)) < 90;
  const panel = (y, h, bright) => {
    ctx.globalAlpha = 1; ctx.fillStyle = "#050506"; ctx.beginPath(); ctx.roundRect(lab, y, L, h, 4 * dpr); ctx.fill();
    ctx.strokeStyle = bright ? "rgba(255,181,46,.55)" : "#2a2b30"; ctx.lineWidth = dpr; ctx.stroke();
    ctx.globalAlpha = v.spin || bright ? 1 : 0.45;
  };
  panel(0, rowH, beamsOut);
  const n = v.beams.length * 2, step = (L - 6 * dpr) / n, r = Math.min(step, rowH) * 0.36;
  for (let k = 0; k < n; k++) {
    const hex = v.beams[k >> 1], lvl = Math.max(...rgb(hex)) / 255, x = lab + 3 * dpr + step * (k + 0.5), y = rowH / 2;
    ctx.fillStyle = lvl > 0.02 ? hex : "#1c1d22";
    if (lvl > 0.02) { ctx.shadowColor = hex; ctx.shadowBlur = 8 * dpr * lvl; }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = "#3a3b41"; ctx.lineWidth = 0.8 * dpr; ctx.stroke();
  }
  const y0 = rowH + gap;
  panel(y0, rowH, !beamsOut);
  const m = v.strip.length, cw = (L - 6 * dpr) / m, rh = (rowH - 6 * dpr) / 3, g = Math.max(1, dpr);
  for (let s = 0; s < m; s++) {
    const hex = v.strip[s], on = Math.max(...rgb(hex)) > 5, w = v.white[s] || 0, x = lab + 3 * dpr + s * cw;
    ctx.fillStyle = on ? hex : "#1c1d22";
    ctx.fillRect(x + g, y0 + 3 * dpr, cw - 2 * g, rh - g);
    ctx.fillRect(x + g, y0 + 3 * dpr + 2 * rh + g, cw - 2 * g, rh - g);
    ctx.fillStyle = w > 0.02 ? `rgba(255,250,235,${0.25 + 0.75 * w})` : "#1c1d22";
    ctx.fillRect(x + g, y0 + 3 * dpr + rh + g / 2, cw - 2 * g, rh - g);
  }
  ctx.globalAlpha = 1;
}

// ---------- drawing: spectrum on the VFD ----------
const peaks = new Array(8).fill(0);
function drawSpectrum() {
  const cv = $("#spec"); if (!visible(cv)) return;
  const ctx = cv.getContext("2d"), dpr = fit(cv), W = cv.width, H = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const bands = (S.vis && S.vis.audio && S.vis.audio.bands) || [];
  const n = 8, gap = 3 * dpr, bw = (W - gap * (n - 1)) / n, cell = 4 * dpr;
  for (let i = 0; i < n; i++) {
    const v = clamp(bands[i] || 0, 0, 1), x = i * (bw + gap);
    peaks[i] = Math.max(v, peaks[i] - 0.012);
    for (let y = H - cell; y >= 0; y -= cell + dpr) {
      const frac = 1 - y / H;
      ctx.fillStyle = frac <= v ? "#6bfbe6" : Math.abs(frac - peaks[i]) < 0.06 ? "#2fbfae" : "#0f2b28";
      ctx.fillRect(x, y, bw, cell);
    }
  }
}

// ---------- displays and status (10 times a second) ----------
const STATE_TEXT = { groove: "GROOVE", breakdown: "BREAKDOWN", drop: "DROP", ambient: "AMBIENT" };
let marqText = "";
function lockText(v) {
  const k = v.clock;
  if (!v.follow) return "tap tempo";
  if (v.audio.state === "off") return "no audio: tap";
  if (v.audio.state === "silent") return "silence";
  if (v.audio.locked && k.source === "audio") return "locked";
  if (k.source === "audio") return "holding tempo";
  if (k.source === "tap") return "tapped, listening";
  return "listening";
}
function updateDom() {
  const v = S.vis;
  $("#conn").textContent = !v || performance.now() - S.lastVis > 1500 ? "RECONNECTING…" : "";
  if (!v) return;
  const lvl = clamp((v.audio.level_db + 60) / 60, 0, 1);
  if (!$("#level").children.length) $("#level").innerHTML = Array.from({ length: 10 }, () => "<i></i>").join("");
  $$("#level i").forEach((el, k) => { el.className = (k + 0.5) / 10 < lvl ? `on${k >= 8 ? " clip" : k >= 6 ? " hot" : ""}` : ""; });
  $("#src").textContent = v.audio.error ? "NO AUDIO" : (v.audio.name || "NO AUDIO").toUpperCase();
  $("#out").innerHTML = S.cfg ? S.cfg.fixtures.map(f => {
    const bad = v.out.errors[`${f.ip}/${f.universe}`];
    const tip = bad || `${targetText(f.ip)}, universe ${f.universe}`;
    return `<span class="${!v.out.enabled ? "" : bad ? "bad" : "ok"}" title="${esc(tip)}">${esc(f.id)}</span>`;
  }).join("") : "";
  $("#previewFlag").textContent = v.preview ? "PREVIEW: SCENE BEING EDITED" : "";
  updateMountReadout();
  if (S.tab === "perform") { updatePerform(v); drawWheel(); return; }
  if (S.tab !== "show") return;

  const k = v.clock;
  setSeven($("#bpm"), k.bpm.toFixed(1).padStart(5, " "));
  $("#where").textContent = `BAR ${k.bar_in_phrase + 1} OF ${k.phrase_bars}`;
  const lock = lockText(v).toUpperCase();
  $("#lock").textContent = lock;
  const scene = sceneBy(v.scene);
  const state = v.blackout ? "BLACKOUT" : v.strobe ? "STROBE" : (STATE_TEXT[v.state] || v.state);
  const last = v.log[0] ? `${v.log[0].text}${v.log[0].by === "you" ? " (YOU)" : ""}` : "";
  const text = [state, scene ? scene.label : v.scene, lock, last, safetyNote()].filter(Boolean).join("  ***  ").toUpperCase() + "  ***  ";
  if (text !== marqText) { marqText = text; $("#marq").textContent = text; }
  const pos = k.bar_in_phrase + (k.beat_in_bar + k.phase) / 4, cells = $$("#phrase i"), per = k.phrase_bars / cells.length;
  cells.forEach((el, i) => { el.className = pos >= (i + 1) * per ? "on" : pos >= i * per ? "now" : ""; });
  for (const b of $$("#scenes .track")) b.setAttribute("aria-pressed", String(b.dataset.name === v.scene));
  $("#auto").setAttribute("aria-pressed", String(v.auto));
  for (const b of $$("#speed .btn")) b.setAttribute("aria-pressed", String(+b.dataset.v === v.speed));
  if (!S.sliding) $("#intensity").value = Math.round(v.intensity * 100);
  paintLivePal();
  $("#liveToggle").setAttribute("aria-pressed", String(livePalette().on));
  const amb = $(".pads [data-showgroup]"); if (amb) amb.classList.toggle("on", v.state === "ambient");
}

// Every frame: beat LEDs, and pads that follow the show.
function updateFast() {
  const v = S.vis; if (!v || (S.tab !== "show" && S.tab !== "perform")) return;
  const k = v.clock;
  $$(S.tab === "show" ? "#beats i" : "#pfBeats i").forEach((el, i) => el.classList.toggle("on", i === k.beat_in_bar && k.phase < 0.5));
  const on16 = (k.beat * 4) % 1 < 0.35;
  for (const sb of $$('.pad[data-hold="strobe"]')) { sb.classList.toggle("flash", v.strobe && on16); sb.classList.toggle("on", v.strobe); }
  for (const bb of $$('.pad[data-hold="blackout"]')) { bb.classList.toggle("dark", v.blackout); bb.classList.toggle("on", v.blackout); }
  $('.pads .pad[data-pad="break"]').classList.toggle("on", v.state === "breakdown");
}

// ---------- editing the magic sheet in Setup ----------
function sheetGeom(cv, dpr) {   // canvas <-> room, for whichever view the sheet shows
  if (S.view === "plan") {
    const xf = sheetXf(cv, dpr);
    return { proj: (x, y) => [xf.X(x), xf.Y(y)], onPlane: (px, py) => xf.inv(px, py), onWall: (px, py) => xf.inv(px, py) };
  }
  const cam = roomCam(cv, dpr);
  return {
    proj: (x, y, z) => cam.proj([x, y, z]),
    onPlane(px, py, z) {   // where the line of sight through the pointer crosses height z
      const r = cam.ray(px, py), k = Math.abs(r[2]) > 1e-6 ? (z - cam.eye[2]) / r[2] : -1;
      return k > 0 ? [cam.eye[0] + r[0] * k, cam.eye[1] + r[1] * k] : null;
    },
    onWall(px, py) { const q = boxExit(cam.eye, cam.ray(px, py)).at; return [q[0], q[1]]; },   // the surface it points at
  };
}
function setupDrag() {
  const cv = $("#sheet");
  const at = e => {
    const dpr = Math.min(2, window.devicePixelRatio || 1), r = cv.getBoundingClientRect();
    return { dpr, px: (e.clientX - r.left) * dpr, py: (e.clientY - r.top) * dpr, g: sheetGeom(cv, dpr) };
  };
  const pick = e => {
    const { dpr, px, py, g } = at(e);
    const dist = s => s ? Math.hypot(s[0] - px, s[1] - py) : Infinity;
    const cl = S.cfg.points.find(p => p.kind === "cluster");
    if (cl) {   // a corner resizes (around the opposite corner)
      for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        const cx = cl.x + sx * cl.w / 2, cy = cl.y + sy * cl.h / 2;
        if (dist(g.proj(cx, cy, cl.z)) < 16 * dpr) return { kind: "resize", p: cl, ax: cl.x - sx * cl.w / 2, ay: cl.y - sy * cl.h / 2 };
      }
    }
    let best = null, bd = 26 * dpr;
    S.cfg.points.forEach(p => { if (p.kind === "cluster") return; const d = dist(g.proj(p.x, p.y, p.z || 0)); if (d < bd) { bd = d; best = { kind: "point", p }; } });
    S.cfg.fixtures.forEach((f, i) => { const d = dist(g.proj(f.x, f.y, f.z)); if (d < bd) { bd = d; best = { kind: "fixture", i, f }; } });
    if (!best && cl) {
      const q = g.onPlane(px, py, cl.z);
      const inside = q && Math.abs(q[0] - cl.x) <= cl.w / 2 && Math.abs(q[1] - cl.y) <= cl.h / 2;
      if (inside || dist(g.proj(cl.x, cl.y, cl.z)) < 30 * dpr) return { kind: "cluster", p: cl, dx: q ? q[0] - cl.x : 0, dy: q ? q[1] - cl.y : 0 };
    }
    return best;
  };
  cv.addEventListener("pointerdown", e => {
    if (!S.editing || S.tab !== "setup") return;
    const best = pick(e); if (!best) return;
    S.dragging = best; cv.setPointerCapture(e.pointerId); e.preventDefault();
  });
  cv.addEventListener("pointermove", e => {
    if (!S.dragging) return;
    const { px, py, g } = at(e), room = S.cfg.room, d = S.dragging;
    const q = d.kind === "fixture" ? g.onWall(px, py) : g.onPlane(px, py, d.p.z || 0);
    if (!q) return;
    const x = clamp(+q[0].toFixed(2), 0, room.w), y = clamp(+q[1].toFixed(2), 0, room.d);
    if (d.kind === "resize") {
      d.p.w = +Math.max(0.2, Math.abs(x - d.ax)).toFixed(2); d.p.h = +Math.max(0.2, Math.abs(y - d.ay)).toFixed(2);
      d.p.x = +((x + d.ax) / 2).toFixed(2); d.p.y = +((y + d.ay) / 2).toFixed(2);
      return;
    }
    if (d.kind === "cluster") { d.p.x = clamp(+(x - d.dx).toFixed(2), 0, room.w); d.p.y = clamp(+(y - d.dy).toFixed(2), 0, room.d); return; }
    if (d.kind === "point") { d.p.x = x; d.p.y = y; return; }
    // bars live on a wall: snap to the nearest one and face into the room
    const dist = [x, room.w - x, y, room.d - y], wi = dist.indexOf(Math.min(...dist));
    d.f.facing = [0, 180, 90, 270][wi];
    d.f.x = wi === 0 ? 0 : wi === 1 ? room.w : x;
    d.f.y = wi === 2 ? 0 : wi === 3 ? room.d : y;
  });
  const end = () => {
    const d = S.dragging; if (!d) return; S.dragging = null;
    if (d.kind === "fixture") api("fixture", { index: d.i, fields: { x: d.f.x, y: d.f.y, facing: d.f.facing } });
    else api("point", { action: "move", id: d.p.id, x: d.p.x, y: d.p.y, ...(d.p.kind === "cluster" ? { w: d.p.w, h: d.p.h } : {}) });
  };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
}

// ---------- main loop ----------
let lastDom = 0;
function safely(fn) { try { fn(); } catch (e) { console.error(e); } }   // one broken drawing mustn't stop the rest
function frame(t) {
  for (const id of ["#sheet", "#pfSheet"]) if (visible($(id))) safely(() => drawSheet($(id), t));
  if (S.cfg) {
    const v = S.vis && S.vis.fixtures, fxs = S.cfg.fixtures;
    const ids = S.tab === "perform" ? [["#pfBarA", "#pfTiltA"], ["#pfBarB", "#pfTiltB"]] : [["#barA", "#tiltA"], ["#barB", "#tiltB"]];
    ids.forEach(([bar, tilt], i) => safely(() => { drawBar($(bar), v && v[i], fxs[i]); drawTilt($(tilt), v && v[i], fxs[i]); }));
  }
  safely(drawSpectrum);
  safely(updateFast);
  if (t - lastDom > 100) { lastDom = t; safely(updateDom); }
  requestAnimationFrame(frame);
}

for (const b of $$(".tabs .key")) b.addEventListener("click", () => setTab(b.dataset.tab));
addEventListener("pagehide", () => {   // closing the page while editing a scene ends its preview
  if (S.tab === "make") navigator.sendBeacon("/api/cmd", JSON.stringify({ cmd: "preview", spec: null }));
});
setupShowControls();
setupPerform();
setupDrag();
function setView(view) {   // the magic sheet: "room" (from the corner across from the balls) or "plan" (from above)
  S.view = view;
  try { localStorage.setItem("lightlaland.sheetView", view); } catch (e) { /* private mode */ }
  for (const b of $$(".viewkeys button")) b.setAttribute("aria-pressed", String(b.dataset.view === view));
}
for (const b of $$(".viewkeys button")) b.addEventListener("click", () => setView(b.dataset.view));
try { setView(localStorage.getItem("lightlaland.sheetView") === "plan" ? "plan" : "room"); } catch (e) { setView("room"); }
loadMeta().then(() => {
  let first = matchMedia("(pointer: coarse)").matches || innerWidth < 900 ? "perform" : "show";
  try { first = localStorage.getItem("lightlaland.tab") || first; } catch (e) { /* private mode */ }
  setTab(first);
  connect(); requestAnimationFrame(frame);
}).catch(e => { console.error(e); toast("Couldn't load settings from the Mac."); });
</script>
</body>
